name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed.
#
#   npm version minor      # bumps package.json and src/index.ts, commits and tags vX.Y.Z
#   git push --follow-tags
#
# Before tagging, move the entries under "Unreleased" in CHANGELOG.md to a new
# "## [X.Y.Z] - YYYY-MM-DD" section: the release notes are taken from it.
#
# npm authentication uses trusted publishing (OIDC), so no token is stored. It must be
# configured once on npmjs.com (package Settings > Trusted Publisher: GitHub Actions,
# repository HugoMVale/numerics-js, workflow release.yml), which is only possible after
# the package exists, so publish the very first version by hand with `npm publish`.
# Alternatively, add an NPM_TOKEN secret and set NODE_AUTH_TOKEN for the publish step.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest

      - name: Check that the tag matches the package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          source_version="$(sed -nE "s/^export const version = '([^']*)';$/\1/p" src/index.ts)"
          if [ "$version" != "$package_version" ] || [ "$version" != "$source_version" ]; then
            echo "Version mismatch: tag=$version, package.json=$package_version, src/index.ts=$source_version." >&2
            echo "Use 'npm version' to bump the version; it keeps all three in sync." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes from the changelog
        run: node scripts/changelog-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish to npm
        # `npm publish` runs the prepublishOnly checks (typecheck, lint, format, tests, build).
        # Skipped when the version already exists, so a failed run can be re-run safely.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping publish."
          else
            npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
          fi

      - name: Pack tarball for the release
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "$RUNNER_TEMP"/*.tgz
