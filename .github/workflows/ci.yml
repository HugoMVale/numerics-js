name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*, node]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack package
        id: pack
        shell: bash
        run: |
          npm pack --json > pack.json
          tarball="$(node -e "console.log(require('./pack.json')[0].filename)")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke test packed package as a consumer
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init --yes --silent
          npm install --ignore-scripts "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}"
          node --input-type=module -e "import { array } from 'numerics-js'; const x = new array.Array1D([1, 2, 3]); if (x.sum() !== 6) throw new Error('Packed package smoke test failed');"       
          printf "import { roots } from 'numerics-js';\nconst root: number = roots.bisection((x) => x * x - 2, 1, 2).x;\nvoid root;\n" > consumer.ts
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 consumer.ts
